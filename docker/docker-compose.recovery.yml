name: telegram-search-recovery

x-recovery-build: &recovery-build
  context: ..
  dockerfile: docker/Dockerfile
  target: recovery

x-owner-environment: &owner-environment
  TG_SEARCH_HOME: /var/lib/tg-search
  RECOVERY_PROFILE: ${RECOVERY_PROFILE:-recovery}
  TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
  TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}

x-report-directory: &report-directory
  type: bind
  source: ${RECOVERY_REPORT_DIR:-/tmp}
  target: /reports
  read_only: false
  bind:
    create_host_path: false

services:
  recovery-auth:
    profiles: [recovery]
    build: *recovery-build
    environment: *owner-environment
    volumes:
      - recovery_owner_data:/var/lib/tg-search
    stdin_open: true
    tty: true
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        : "$${TELEGRAM_API_ID:?Set TELEGRAM_API_ID}"
        : "$${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH}"
        exec tg-search --profile "$${RECOVERY_PROFILE}" auth login

  recovery-audit-sqlite:
    profiles: [recovery]
    build: *recovery-build
    environment:
      <<: *owner-environment
      RECOVERY_FROM: ${RECOVERY_FROM:-}
      RECOVERY_TO: ${RECOVERY_TO:-}
      RECOVERY_REPORT_DIR: ${RECOVERY_REPORT_DIR:-}
      RECOVERY_REPORT_FILE: ${RECOVERY_REPORT_FILE:-}
      RECOVERY_ETM_SQLITE_DB_FILE: ${RECOVERY_ETM_SQLITE_DB_FILE:-}
    volumes:
      - recovery_owner_data:/var/lib/tg-search
      - *report-directory
      - type: bind
        source: ${RECOVERY_ETM_SQLITE_DB_FILE:-/dev/null}
        target: /etm/tgdata.db
        read_only: true
        bind:
          create_host_path: false
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        : "$${TELEGRAM_API_ID:?Set TELEGRAM_API_ID}"
        : "$${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH}"
        : "$${RECOVERY_FROM:?Set RECOVERY_FROM to a timezone-aware ISO 8601 timestamp}"
        : "$${RECOVERY_TO:?Set RECOVERY_TO to a timezone-aware ISO 8601 timestamp}"
        : "$${RECOVERY_REPORT_DIR:?Set RECOVERY_REPORT_DIR to an existing report directory}"
        : "$${RECOVERY_REPORT_FILE:?Set RECOVERY_REPORT_FILE to a report filename}"
        : "$${RECOVERY_ETM_SQLITE_DB_FILE:?Set RECOVERY_ETM_SQLITE_DB_FILE to the ETM SQLite database}"
        case "$${RECOVERY_REPORT_FILE}" in
          */*) echo 'RECOVERY_REPORT_FILE must be a filename within RECOVERY_REPORT_DIR' >&2; exit 2 ;;
        esac
        exec tg-search recovery audit \
          --profile "$${RECOVERY_PROFILE}" \
          --etm-sqlite /etm/tgdata.db \
          --from "$${RECOVERY_FROM}" \
          --to "$${RECOVERY_TO}" \
          --output "/reports/$${RECOVERY_REPORT_FILE}" \
          --takeout

  recovery-audit-postgresql:
    profiles: [recovery]
    build: *recovery-build
    environment:
      <<: *owner-environment
      RECOVERY_FROM: ${RECOVERY_FROM:-}
      RECOVERY_TO: ${RECOVERY_TO:-}
      RECOVERY_REPORT_DIR: ${RECOVERY_REPORT_DIR:-}
      RECOVERY_REPORT_FILE: ${RECOVERY_REPORT_FILE:-}
      RECOVERY_ETM_POSTGRES_URL: ${RECOVERY_ETM_POSTGRES_URL:-}
    volumes:
      - recovery_owner_data:/var/lib/tg-search
      - *report-directory
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        : "$${TELEGRAM_API_ID:?Set TELEGRAM_API_ID}"
        : "$${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH}"
        : "$${RECOVERY_FROM:?Set RECOVERY_FROM to a timezone-aware ISO 8601 timestamp}"
        : "$${RECOVERY_TO:?Set RECOVERY_TO to a timezone-aware ISO 8601 timestamp}"
        : "$${RECOVERY_REPORT_DIR:?Set RECOVERY_REPORT_DIR to an existing report directory}"
        : "$${RECOVERY_REPORT_FILE:?Set RECOVERY_REPORT_FILE to a report filename}"
        : "$${RECOVERY_ETM_POSTGRES_URL:?Set RECOVERY_ETM_POSTGRES_URL to the ETM PostgreSQL DSN}"
        case "$${RECOVERY_REPORT_FILE}" in
          */*) echo 'RECOVERY_REPORT_FILE must be a filename within RECOVERY_REPORT_DIR' >&2; exit 2 ;;
        esac
        exec tg-search recovery audit \
          --profile "$${RECOVERY_PROFILE}" \
          --etm-postgres-url "$${RECOVERY_ETM_POSTGRES_URL}" \
          --from "$${RECOVERY_FROM}" \
          --to "$${RECOVERY_TO}" \
          --output "/reports/$${RECOVERY_REPORT_FILE}" \
          --takeout

volumes:
  recovery_owner_data:
